appId: com.exalandru.quantumdraft
productName: Quantum Draft
directories:
  buildResources: build
  output: dist
files:
  - out/**
  - resources/**
  - THIRD-PARTY-NOTICES.md
  - '!**/*.map'
asarUnpack:
  - resources/**
fileAssociations:
  - ext: fountain
    name: Scénario Fountain
    description: Scénario au format Fountain
    role: Editor
mac:
  icon: build/icon.png
  category: public.app-category.productivity
  target:
    - dmg
    - zip
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
win:
  icon: build/icon.png
  target:
    - nsis
linux:
  icon: build/icon.png
  target:
    - AppImage
    - deb
  category: Office
