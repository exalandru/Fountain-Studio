appId: com.exalandru.fountainstudio
productName: Fountain Studio
directories:
  buildResources: build
  output: dist
asar: true
compression: maximum
artifactName: '${productName}-${version}-${os}-${arch}.${ext}'
files:
  - out/**
  - resources/**
  # The AGPL requires a copy of itself to travel with the program, so the licence ships inside
  # the bundle rather than only living in the repository.
  - LICENSE
  - THIRD-PARTY-NOTICES.md
  - '!**/*.map'
asarUnpack:
  - resources/**
fileAssociations:
  - ext: fountain
    name: Fountain screenplay
    description: Screenplay in the Fountain format
    role: Editor
mac:
  icon: build/icon.png
  category: public.app-category.productivity
  target:
    - dmg
    - zip
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  gatekeeperAssess: false
win:
  icon: build/icon.png
  target:
    - nsis
linux:
  icon: build/icon.png
  target:
    - AppImage
    - deb
  category: Office
  synopsis: Fountain screenplay editor
