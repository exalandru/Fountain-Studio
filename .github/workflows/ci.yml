name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: Verification (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Licence gate: no incompatible dependency may enter the tree (PLAN.md §2.1).
      - run: npm run check:licenses

      - run: npm run format:check

      - run: npm run lint

      - run: npm run typecheck

      - run: npm test

      - run: npm run build

      # Validate electron-builder's current-platform configuration without producing
      # installers or signing artifacts.
      - run: npm run package:dir

      # End-to-end tests require a display server on Linux.
      - name: E2E tests (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: xvfb-run --auto-servernum npm run test:e2e

      - name: E2E tests (macOS, Windows)
        if: matrix.os != 'ubuntu-latest'
        run: npm run test:e2e

      - name: Failure logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: results-${{ matrix.os }}
          path: |
            test-results/
            playwright-report/
          retention-days: 7
